
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        SchoolSystem | Matrícula
    </title>

    <link rel="stylesheet" href="../CSS/cadastro.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            School<span>System</span>
        </div>

        <nav class="nav">

            <a href="aluno.html">
                Aluno
            </a>

            <a href="rematricula.html">
                Rematrícula
            </a>

            <a href="login.html">
                Sair
            </a>

        </nav>

    </header>

    <main class="container">


        <section class="hero">

            <h1>
                Matrícula do Aluno
            </h1>

            <p>
                Cadastre o aluno e seus responsáveis.
            </p>

        </section>

        <form id="formCadastro" class="form-card">

            <h2>
                Dados do aluno
            </h2>

            <div class="form-grid">


                <div class="form-group">

                    <label for="nome">
                        Nome completo *
                    </label>

                    <input type="text" id="nome" placeholder="Nome do aluno" required>

                </div>

                <div class="form-group">

                    <label for="cpf">
                        CPF *
                    </label>

                    <input type="text" id="cpf" placeholder="000.000.000-00" required>

                </div>

                <div class="form-group">

                    <label for="nascimento">
                        Data de nascimento *
                    </label>

                    <input type="date" id="nascimento" required>

                </div>

                <div class="form-group">

                    <label for="sexo">
                        Sexo
                    </label>

                    <select id="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Feminino
                        </option>

                        <option>
                            Masculino
                        </option>

                        <option>
                            Outro
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="turma">
                        Turma *
                    </label>

                    <select id="turma" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="3DS">
                            3ºDS - Manhã
                        </option>

                        <option value="2DS">
                            2ºDS - Manhã
                        </option>

                        <option value="1DS">
                            1ºDS - Tarde
                        </option>

                    </select>

                </div>

            </div>

            <h2>
                Responsável Financeiro
            </h2>

            <div class="form-grid">


                <div class="form-group">

                    <label for="responsavelFinanceiro">
                        Nome *
                    </label>

                    <input type="text" id="responsavelFinanceiro" required>

                </div>


                <div class="form-group">

                    <label for="telefoneFinanceiro">
                        Telefone
                    </label>

                    <input type="tel" id="telefoneFinanceiro">

                </div>


            </div>

            <h2>
                Responsável Pedagógico
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="responsavelPedagogico">
                        Nome *
                    </label>

                    <input type="text" id="responsavelPedagogico" required>

                </div>


                <div class="form-group">

                    <label for="telefonePedagogico">
                        Telefone
                    </label>

                    <input type="tel" id="telefonePedagogico">

                </div>


            </div>

            <button type="submit" class="btn-salvar">
                Cadastrar aluno
            </button>

        </form>

    </main>

    <footer class="footer">

        SchoolSystem

    </footer>
    
    <script src="../JS/cadastro.js"></script>

</body>

</html>
