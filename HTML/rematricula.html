<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        SchoolSystem | Rematrícula
    </title>
    <link rel="stylesheet" href="../CSS/rematricula.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            School<span>System</span>
        </div>


        <nav class="nav">

            <a href="aluno.html">
                Aluno
            </a>

            <a href="professor.html">
                Professor
            </a>

            <a href="cadastro.html">
                Matrícula
            </a>

            <a href="rematricula.html">
                Rematrícula
            </a>

            <a href="login.html">
                Sair
            </a>

        </nav>

    </header>

    <main class="container">


        <section class="hero">

            <h1>
                Rematrícula
            </h1>

            <p>
                Atualize os dados escolares
                do aluno para o próximo ano.
            </p>

        </section>

        <section class="card">

            <h2>
                Buscar aluno
            </h2>

            <div class="busca">

                <input type="text" id="cpfBusca" placeholder="Digite o CPF do aluno">

                <button id="buscarAluno">
                     Buscar
                </button>

            </div>

        </section>

        <section class="card" id="dadosAluno" style="display:none;">

            <h2>
                Dados encontrados
            </h2>


            <div class="form-group">

                <label>
                    Nome do aluno
                </label>

                <input type="text" id="nomeAluno" readonly>

            </div>

            <div class="form-group">

                <label>
                    Turma atual
                </label>

                <input type="text" id="turmaAtual" readonly>

            </div>

            <div class="form-group">

                <label for="novaTurma">
                    Nova turma
                </label>

                <select id="novaTurma">

                    <option value="3DS">
                        3ºDS - Manhã
                    </option>

                    <option value="2DS">
                        2ºDS - Manhã
                    </option>

                    <option value="1DS">
                        1ºDS - Tarde
                    </option>

                </select>

            </div>

            <button id="salvarRematricula" class="btn-salvar">
                Confirmar rematrícula
            </button>

        </section>

    </main>

    <footer class="footer">

        SchoolSystem

    </footer>

    <script src="../JS/rematricula.js"></script>

</body>

</html>
