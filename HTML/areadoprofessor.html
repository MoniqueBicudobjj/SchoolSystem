<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        SchoolSystem | Diário de Classe
    </title>

    <link rel="stylesheet" href="../CSS/areadoprofessor.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            School<span>System</span>
        </div>


        <nav class="nav">

            <a href="professor.html">
                Notas
            </a>

            <a href="areadoprofessor.html">
                Diário
            </a>

            <a href="cadastro.html">
                Matrícula
            </a>

            <a href="rematricula.html">
                Rematrícula
            </a>

            <a href="login.html">
                Sair
            </a>

        </nav>

    </header>

    <main class="container">


        <section class="hero">

            <h1>
                Chamada
            </h1>

            <p>
                Registre a presença dos alunos.
            </p>

        </section>

        <section class="card">

            <div class="topo-diario">

                <div>

                    <label for="dataAula">
                        Data da aula
                    </label>

                    <input type="date" id="dataAula">

                </div>


                <div>

                    <label for="turmaDiario">
                        Turma
                    </label>

                    <select id="turmaDiario">

                        <option>
                            3ºDS
                        </option>

                        <option>
                            2ºDS
                        </option>

                    </select>

                </div>

            </div>

        </section>

        <h2 class="section-title">
            Chamada
        </h2>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Aluno
                        </th>

                        <th>
                            Presença
                        </th>

                        <th>
                            Situação
                        </th>

                    </tr>

                </thead>


                <tbody id="listaPresenca">

                </tbody>

            </table>

        </div>


        <button class="btn-salvar" onclick="salvarPresenca()">
            Salvar chamada
        </button>


        <div class="resumo" id="resumoFrequencia">
        </div>


    </main>

    <footer class="footer">

        SchoolSystem 

    </footer>

    <script src="../JS/areadoprofessor.js"></script>

</body>

</html>
